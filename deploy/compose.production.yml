# 正式域名与 HTTPS 的可选生产叠加层。
# 与 compose.yml 一起使用；由 ENABLE_CADDY=1 的部署脚本自动加载。
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?启用 Caddy 时必须设置 APP_DOMAIN}
    ports:
      - "${HTTP_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eatanything

volumes:
  caddy_data:
    name: ${CADDY_DATA_VOLUME:-eat-anything-caddy-data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:-eat-anything-caddy-config}
