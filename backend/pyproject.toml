[project]
name = "eat-anything-backend"
version = "0.1.0"
description = "FastAPI backend for the Eat Anything mini app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.31,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.8,<3",
  "passlib[argon2]>=1.7,<2",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "orjson>=3.10,<4",
  "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff==0.15.12",
  "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
