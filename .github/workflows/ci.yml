name: CI

on:
  push:
    branches: [main, 'chore/**', 'release/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text())
          dependencies = data['project']['dependencies'] + data['project']['optional-dependencies']['dev']
          Path('/tmp/eatanything-backend-requirements.txt').write_text('\n'.join(dependencies) + '\n')
          PY
          pip install -r /tmp/eatanything-backend-requirements.txt
      - name: 编译检查
        run: python -m compileall -q app
      - name: Ruff
        run: ruff check app tests
      - name: 测试
        run: pytest tests -q
      - name: 构建 API 镜像
        working-directory: .
        run: docker build -f backend/Dockerfile backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: TypeScript 检查
        run: npm run type-check
      - name: 前端自动化测试
        run: npm test
      - name: 微信小程序生产构建
        run: npm run build:mp-weixin
      - name: H5 生产构建
        run: npm run build:h5
      - name: 生产产物检查
        run: npm run verify:production

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose 模板校验
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.example config --quiet
      - name: Shell 语法检查
        run: bash -n deploy/scripts/deploy.sh deploy/scripts/backup.sh deploy/scripts/restore-postgres.sh
      - name: 工作区敏感文件检查
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|(^|/)backups/|(^|/)\.pytest_cache/|(^|/)node_modules/' || (echo '发现不应提交的文件' >&2; exit 1)
